<svg viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dream Events .com">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&amp;display=swap');
  </style>
  <defs>
    <linearGradient id="gradDream" gradientUnits="userSpaceOnUse" x1="70" y1="260" x2="1225" y2="260">
      <stop offset="0" stop-color="#2AA4FF"/>
      <stop offset="0.22" stop-color="#3F6BFF"/>
      <stop offset="0.48" stop-color="#7B2FF7"/>
      <stop offset="0.74" stop-color="#C512E0"/>
      <stop offset="1" stop-color="#FF1493"/>
    </linearGradient>
    <linearGradient id="gradGold" gradientUnits="userSpaceOnUse" x1="470" y1="480" x2="830" y2="540">
      <stop offset="0" stop-color="#F5D57A"/>
      <stop offset="1" stop-color="#E0B143"/>
    </linearGradient>
    <linearGradient id="gradLineL" gradientUnits="userSpaceOnUse" x1="250" y1="0" x2="430" y2="0">
      <stop offset="0" stop-color="#2AA4FF"/>
      <stop offset="1" stop-color="#3F6BFF"/>
    </linearGradient>
    <linearGradient id="gradLineR" gradientUnits="userSpaceOnUse" x1="866" y1="0" x2="1046" y2="0">
      <stop offset="0" stop-color="#C512E0"/>
      <stop offset="1" stop-color="#FF1493"/>
    </linearGradient>
    <linearGradient id="gradCom" gradientUnits="userSpaceOnUse" x1="580" y1="0" x2="730" y2="0">
      <stop offset="0" stop-color="#7B2FF7"/>
      <stop offset="1" stop-color="#D912D9"/>
    </linearGradient>
    <mask id="swooshCut">
      <rect x="0" y="0" width="1280" height="640" fill="white"/>
      <path d="M20,470 L20,355 C60,425 160,452 310,458 L310,470 Z" fill="black"/>
    </mask>
  </defs>

  <!-- ===== D estilizada con corte swoosh ===== -->
  <g mask="url(#swooshCut)">
    <path fill="#FFFFFF" fill-rule="evenodd"
      d="M70,90 L205,90 C300,90 352,164 352,262 C352,360 300,432 205,432 L70,432 Z
         M138,156 L200,156 C254,156 286,200 286,262 C286,324 254,368 200,368 L138,368 Z"/>
  </g>
  <!-- cola del swoosh -->
  <path fill="#FFFFFF"
    d="M32,376 C72,442 172,462 288,446 C192,480 80,462 32,376 Z"/>

  <!-- ===== destello dorado dentro de la D ===== -->
  <path fill="#F5D57A"
    d="M186,172 C190,209 200,219 236,224 C200,229 190,239 186,276 C182,239 172,229 136,224 C172,219 182,209 186,172 Z"/>

  <!-- ===== "ream" ===== -->
  <text x="346" y="432" font-family="Poppins, Montserrat, 'Segoe UI', Arial, sans-serif"
        font-size="330" font-weight="500" letter-spacing="-6"
        fill="#FFFFFF">ream</text>

  <!-- ===== EVENTS ===== -->
  <line x1="250" y1="505" x2="430" y2="505" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="7" stroke-linecap="round"/>
  <text x="661" y="527" text-anchor="middle"
        font-family="Poppins, Montserrat, 'Segoe UI', Arial, sans-serif"
        font-size="62" font-weight="500" letter-spacing="26"
        fill="url(#gradGold)">EVENTS</text>
  <line x1="866" y1="505" x2="1046" y2="505" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="7" stroke-linecap="round"/>

  <!-- ===== .COM ===== -->
  <text x="655" y="600" text-anchor="middle"
        font-family="Poppins, Montserrat, 'Segoe UI', Arial, sans-serif"
        font-size="40" font-weight="500" letter-spacing="14"
        fill="#FFFFFF" fill-opacity="0.85">.COM</text>
</svg>
